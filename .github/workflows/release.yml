# Builds the PC binaries and the Android APK on every push and pull request.
# Pushing a tag like v1.2.0 also publishes them as a GitHub Release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older build, so the slow macOS runners aren't tied
# up with outdated commits. Tag builds (releases) always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  pc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: sofa-remote-windows-x64.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: sofa-remote-linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: sofa-remote-linux-arm64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: sofa-remote-macos-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, name: sofa-remote-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Bundle the gamepad driver installer
        if: ${{ contains(matrix.target, 'windows') }}
        run: pwsh -NoProfile -File vendor/fetch.ps1
      - run: cargo test --release --target ${{ matrix.target }}
        env: { SOFA_REQUIRE_DRIVER: 1 }
        if: ${{ !contains(matrix.target, 'x86_64-apple') }}
      - run: cargo build --release --target ${{ matrix.target }}
        env: { SOFA_REQUIRE_DRIVER: 1 }
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p release
          src=target/${{ matrix.target }}/release/sofa-remote
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "release/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # The runner image already has the Android SDK (ANDROID_HOME); Gradle fetches missing platforms
      - name: Build APK
        working-directory: android
        env:
          # Optional repository secrets: the signing key (base64 of sofa-remote.keystore) and its passwords
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then echo "$ANDROID_KEYSTORE" | base64 -d > sofa-remote.keystore; fi
          ./gradlew assembleRelease --no-daemon   # copies the APK to ../release/
      - uses: actions/upload-artifact@v4
        with:
          name: sofa-remote-android.apk
          path: release/sofa-remote-android.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add the gamepad driver installer
        # Also a release file of its own: sofa-remote downloads it from here when it has no bundled
        # copy, and people can get it by hand. Same pinned SHA-256 as vendor/fetch.ps1.
        run: |
          f=ViGEmBus_1.22.0_x64_x86_arm64.exe
          curl -fsSL -o "release/$f" "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/$f"
          echo "89220a7865076b342892f98865f3499fb7c4cfd673159e89d352c360fd014c6a  release/$f" | sha256sum -c
      - name: Check every download is there
        # The full set, or no release at all (the list is also in AGENTS.md)
        run: |
          for f in sofa-remote-windows-x64.exe sofa-remote-linux-x64 sofa-remote-linux-arm64 \
                   sofa-remote-macos-arm64 sofa-remote-macos-x64 sofa-remote-android.apk \
                   ViGEmBus_1.22.0_x64_x86_arm64.exe; do
            test -s "release/$f" || { echo "::error::release/$f is missing"; exit 1; }
          done
          # the Windows exe has the driver installer built in (about 6 MB of it)
          test "$(stat -c %s release/sofa-remote-windows-x64.exe)" -gt 9000000 \
            || { echo "::error::sofa-remote-windows-x64.exe has no bundled driver installer"; exit 1; }
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
