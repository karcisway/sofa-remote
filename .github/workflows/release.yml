# Builds the PC binaries and the Android APK on every push and pull request.
# Pushing a tag like v1.2.0 also publishes them as a GitHub Release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: sofa-remote-windows-x64.exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: sofa-remote-linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: sofa-remote-linux-arm64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: sofa-remote-macos-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, name: sofa-remote-macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }}
        if: ${{ !contains(matrix.target, 'x86_64-apple') }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p release
          src=target/${{ matrix.target }}/release/sofa-remote
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "release/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/${{ matrix.name }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android
        env:
          # Optional repository secrets: the signing key (base64 of sofa-remote.keystore) and its passwords
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then echo "$ANDROID_KEYSTORE" | base64 -d > sofa-remote.keystore; fi
          ./gradlew assembleRelease --no-daemon   # copies the APK to ../release/
      - uses: actions/upload-artifact@v4
        with:
          name: sofa-remote-android.apk
          path: release/sofa-remote-android.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
