[package]
name = "sofa-remote"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
open = "5.4.5"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
webrtc = { version = "0.21.1", optional = true }

[features]
webrtc = ["dep:webrtc"]
default = ["webrtc"]

[target."cfg(not(windows))".dependencies]
enigo = "0.6.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Foundation"] }
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
vigem-client = { path = "vendor/vigem-client" }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
