<!doctype html>

<html><head><meta charset="utf-8">

<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0e0f13; color: #e8e9ee; }

p { font: 500 26px/1.4 "DM Sans", sans-serif; color: #c7cad6; margin: 0; max-width: 24ch; }
.tag { margin-top: 34px; font: 400 18px "Silkscreen", monospace; color: #ffb547; text-transform: uppercase; display: flex; gap: 12px; align-items: center; }

<div class="art"></div>
<div class="box">
